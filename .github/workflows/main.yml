name: Compile and Run

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'

jobs:
  build:
    name: ${{ matrix.os }} (Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 8
          - os: ubuntu-22.04
            java: 8
          - os: macos-15
            java: 11
          - os: macos-15-intel
            java: 8
          - os: windows-latest
            java: 8

    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            pom.xml
            src/

      - name: Setup Java + Maven
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: ${{ matrix.java }}
          java-distribution: temurin
          maven-version: 3.9.9
          cache-enabled: true
          checkout-enabled: false

      - name: Cache Scala
        uses: actions/cache@v4
        id: cache-scala
        with:
          path: |
            ~/.scala
            C:\scala
          key: ${{ runner.os }}-scala-2.12.20

      - name: Install Scala (Unix)
        if: runner.os != 'Windows' && steps.cache-scala.outputs.cache-hit != 'true'
        run: |
          curl -L https://downloads.lightbend.com/scala/2.12.20/scala-2.12.20.tgz | tar xz
          mv scala-2.12.20 $HOME/.scala

      - name: Add Scala to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.scala/bin" >> $GITHUB_PATH

      - name: Install Scala (Windows)
        if: runner.os == 'Windows' && steps.cache-scala.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://downloads.lightbend.com/scala/2.12.20/scala-2.12.20.msi -OutFile scala.msi
          Start-Process msiexec.exe -ArgumentList '/i', 'scala.msi', '/quiet', '/norestart' -Wait
          New-Item -ItemType Directory -Force -Path C:\scala | Out-Null
          Copy-Item "C:\Program Files (x86)\scala\*" C:\scala -Recurse

      - name: Add Scala to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\scala\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with Maven
        run: mvn -B clean package
